# Weekly dependency and security-advisory updates as pull requests (AW-211).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      vite:
        patterns:
          - vite
          - "@vitejs/*"
          - vitest
          - "@vitest/*"
      lint:
        patterns:
          - eslint
          - "@eslint/*"
          - "eslint-plugin-*"
          - globals
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
