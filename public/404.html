<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="only light" />
    <title>File not found · Alabama Wholesale Inc</title>
    <!-- Netlify sends this page for a missing file under /assets or /img
         (netlify.toml, AW-179): usually an old code file after a new deploy.
         Static on purpose: no script, system fonts only, and only an inline
         <style>, which the Content-Security-Policy allows. Colours match
         --purple and --orange in src/index.css, like the boot shell in
         index.html. -->
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box; text-align: center; background: #fff; color: #281459; font: 1rem/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { max-width: 36em; }
      .brand { margin: 0 0 1rem; font: 800 2rem/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #ed5a21; }
      .brand small { display: block; margin-top: 6px; font-size: 0.75rem; letter-spacing: 0.2em; color: #281459; }
      h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
      p { margin: 0 0 1rem; }
      a { color: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Alabama<small>WHOLESALE INC.</small></p>
      <h1>This file isn’t here</h1>
      <p>The site may have been updated since this page was opened.</p>
      <p><a href="/">Go to the home page</a></p>
    </main>
  </body>
</html>
