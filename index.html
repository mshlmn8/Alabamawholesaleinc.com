<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#281459" />
    <!-- Light only: browsers that force dark mode leave the page alone (AW-038). -->
    <meta name="color-scheme" content="only light" />
    <!-- The body and heading fonts start downloading with the HTML instead of
         after the app renders (AW-178). Vite rewrites these to the same hashed
         /assets files the stylesheet uses. -->
    <link rel="preload" href="/src/fonts/dm-sans-latin-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/barlow-condensed-latin-700.woff2" as="font" type="font/woff2" crossorigin />
    <!-- The home page's title and description, the same as src/lib/meta.js
         gives the home page (HOME_TITLE and HOME_PITCH in src/data/content.js;
         src/lib/meta.test.js checks they match, AW-318). -->
    <title>Wholesale Tobacco, Vapes &amp; Candy · Alabama Wholesale Inc</title>
    <meta name="description" content="Wholesale tobacco, vapes, candy, drinks, grocery and motor oil for licensed retailers. Next-day delivery on our routes in Alabama, Mississippi and Georgia." />
    <!-- Every path without a page file of its own serves this file, so the
         canonical link and og:url are set per page: in the page files the
         build writes (scripts/build-route-heads.mjs) and by the app
         (src/lib/meta.js, AW-181), instead of pointing every URL at the
         homepage here. -->

    <!-- Favicons and share image are rendered from src/assets/logo.jpg by scripts/build-images.mjs -->
    <!-- TODO(owner): A vector logo with a transparent background, and a warehouse or assortment photo for the share card. The vector logo also gives an SVG favicon (/favicon.svg, linked above favicon.ico). (AW-035, AW-288, AW-289) -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / social previews: the home page's. The build writes each
         catalog and support page's own into its page file
         (scripts/build-route-heads.mjs, AW-181), and the app updates them as
         it moves between pages (src/lib/meta.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alabama Wholesale Inc" />
    <meta property="og:title" content="Wholesale Tobacco, Vapes &amp; Candy · Alabama Wholesale Inc" />
    <meta property="og:description" content="Wholesale tobacco, vapes, candy, drinks, grocery and motor oil for licensed retailers. Next-day delivery on our routes in Alabama, Mississippi and Georgia." />
    <meta property="og:image" content="https://alabamawholesaleinc.com/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Alabama Wholesale Inc logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wholesale Tobacco, Vapes &amp; Candy · Alabama Wholesale Inc" />
    <meta name="twitter:description" content="Wholesale tobacco, vapes, candy, drinks, grocery and motor oil for licensed retailers. Next-day delivery on our routes in Alabama, Mississippi and Georgia." />
    <meta name="twitter:image" content="https://alabamawholesaleinc.com/og.jpg" />
    <!-- Fonts (Barlow Condensed + DM Sans) are bundled locally in src/fonts — no external font dependency. -->

    <!-- Boot shell (AW-193): shown until the app renders, with system fonts only.
         Colours match --purple and --orange in src/index.css. Keep the phone,
         email and age key in sync with COMPANY and STORAGE.age in
         src/data/content.js (src/boot-shell.test.js checks them). -->
    <style>
      body { margin: 0; }
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; padding: 24px 16px; box-sizing: border-box; text-align: center; background: #fff; color: #281459; font: 600 1rem/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .boot p { margin: 0; max-width: 36em; }
      .boot a { color: inherit; text-decoration: underline; }
      .boot-brand { font: 800 2rem/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #ed5a21; }
      .boot-brand small { display: block; margin-top: 6px; font-size: 0.75rem; letter-spacing: 0.2em; color: #281459; }
      .boot-help { visibility: hidden; }
      .boot.slow .boot-help { visibility: visible; }
      html.aw-gate .boot, html.aw-gate .boot-brand small { background: #281459; color: #fff; }
    </style>
    <noscript><style>#root .boot { display: none; }</style></noscript>
    <script>
      // Visitors the age gate will ask get its purple, so the shell does not
      // flash white first. Same test as src/lib/ageGate.js: a record from the
      // last 30 days (2592000000 ms) dated no more than a day (86400000 ms)
      // ahead; the old undated 'yes' no longer counts. The trade desk line
      // appears if the app has not rendered after 8s.
      (function () {
        var gate = true;
        try {
          var raw = localStorage.getItem('aw-age-verified'), rec = null, now = Date.now();
          try { rec = JSON.parse(raw); } catch (e) {}
          var at = rec && rec.ok === true ? rec.at : NaN;
          gate = !(typeof at === 'number' && isFinite(at) && at <= now + 86400000 && now - at < 2592000000);
        } catch (e) {}
        if (gate) document.documentElement.classList.add('aw-gate');
      })();
      setTimeout(function () { var b = document.querySelector('#root .boot'); if (b) b.classList.add('slow'); }, 8000);
    </script>

    <!-- Structured data (AW-320): the business, a WholesaleStore, and the
         website it publishes. Name, phone, email, address and hours match
         COMPANY and HOURS in src/data/content.js, and hasMap is a Google Maps
         search for that address (src/boot-shell.test.js checks them).
         Category, line and product pages add a BreadcrumbList
         (#aw-breadcrumbs, src/lib/meta.js). The origin is replaced by
         VITE_SITE_URL's when it is set (scripts/site-url.mjs, AW-052). -->
    <!-- TODO(owner): Latitude and longitude of the warehouse, plus the Google Business and social profile URLs. (AW-320) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WholesaleStore",
          "@id": "https://alabamawholesaleinc.com/#business",
          "name": "Alabama Wholesale Inc",
          "url": "https://alabamawholesaleinc.com/",
          "logo": "https://alabamawholesaleinc.com/icon-512.png",
          "image": "https://alabamawholesaleinc.com/og.jpg",
          "telephone": "+1-205-354-4473",
          "email": "Alabamawholesaleinc@gmail.com",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "613 Graymont Ave N",
            "addressLocality": "Birmingham",
            "addressRegion": "AL",
            "postalCode": "35203",
            "addressCountry": "US"
          },
          "hasMap": "https://www.google.com/maps/search/?api=1&query=613%20Graymont%20Ave%20N%2C%20Birmingham%2C%20AL%2035203",
          "openingHoursSpecification": [
            { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"], "opens": "07:00", "closes": "18:00" },
            { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Saturday","Sunday"], "opens": "08:00", "closes": "17:30" }
          ],
          "areaServed": ["Alabama","Georgia","Mississippi"]
        },
        {
          "@type": "WebSite",
          "@id": "https://alabamawholesaleinc.com/#website",
          "url": "https://alabamawholesaleinc.com/",
          "name": "Alabama Wholesale Inc",
          "publisher": { "@id": "https://alabamawholesaleinc.com/#business" }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <span class="boot-brand">Alabama<small>WHOLESALE INC.</small></span>
        <p>Loading the wholesale catalog…</p>
        <p class="boot-help">Trouble loading? Call <a href="tel:+12053544473">(205) 354-4473</a> or email <a href="mailto:Alabamawholesaleinc@gmail.com">Alabamawholesaleinc@gmail.com</a>.</p>

    </div>

        <p>This catalog needs JavaScript. To order, call <a href="tel:+12053544473">(205) 354-4473</a> or email <a href="mailto:Alabamawholesaleinc@gmail.com">Alabamawholesaleinc@gmail.com</a>.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
