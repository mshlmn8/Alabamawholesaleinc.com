<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#281459" />
    <title>Alabama Wholesale Inc · Wholesale Distributor — Birmingham, AL</title>
    <meta name="description" content="Wholesale tobacco, vapes, candy, drinks, grocery and motor oil for licensed retailers. Next-day delivery on our routes in Alabama, Mississippi and Georgia from our Birmingham warehouse." />
    <link rel="canonical" href="https://alabamawholesaleinc.com/" />

    <!-- Favicons and share image are rendered from src/assets/logo.jpg by scripts/build-images.mjs -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / social previews. Title and description are updated per page by the app. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Alabama Wholesale Inc" />
    <meta property="og:title" content="Alabama Wholesale Inc · Wholesale Distributor — Birmingham, AL" />
    <meta property="og:description" content="Wholesale tobacco, vapes, candy, drinks, grocery and motor oil for licensed retailers. Next-day delivery on our routes in Alabama, Mississippi and Georgia from our Birmingham warehouse." />
    <meta property="og:url" content="https://alabamawholesaleinc.com/" />
    <meta property="og:image" content="https://alabamawholesaleinc.com/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Alabama Wholesale Inc logo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://alabamawholesaleinc.com/og.jpg" />
    <!-- Fonts (Barlow Condensed + DM Sans) are bundled locally in src/fonts — no external font dependency. -->

    <!-- LocalBusiness structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Alabama Wholesale Inc",
      "url": "https://alabamawholesaleinc.com/",
      "image": "https://alabamawholesaleinc.com/og.jpg",
      "telephone": "+1-205-354-4473",
      "email": "Alabamawholesaleinc@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "613 Graymont Ave N",
        "addressLocality": "Birmingham",
        "addressRegion": "AL",
        "postalCode": "35203",
        "addressCountry": "US"
      },
      "openingHoursSpecification": [
        { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday"], "opens": "07:00", "closes": "18:00" },
        { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Saturday","Sunday"], "opens": "08:00", "closes": "17:30" }
      ],
      "areaServed": ["Alabama","Georgia","Mississippi","Tennessee"]
    }
    </script>
  </head>
  <body>
    <!-- Static form definitions for Netlify Forms. The build-time HTML parser
         registers these by name; the live React forms POST to "/" with matching
         field names. Hidden from users via display:none. -->
    <form name="apply" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="business" />
      <input type="text" name="contact" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="type" />
      <input type="text" name="license" />
      <input type="text" name="state" />
      <input type="text" name="volume" />
      <input type="text" name="bot-field" />
    </form>
    <form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="business" />
      <input type="text" name="contact" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="delivery" />
      <input type="date" name="preferredDate" />
      <textarea name="notes"></textarea>
      <input type="text" name="refNum" />
      <input type="text" name="accountType" />
      <textarea name="items"></textarea>
      <input type="number" name="totalUnits" />
      <input type="text" name="subtotal" />
      <input type="text" name="bot-field" />
    </form>
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
